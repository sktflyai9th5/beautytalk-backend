# BeautyTalk 백엔드 — 팀 노트북(RTX 4090)에서
#   docker compose up -d --build
#   docker compose logs -f          # 모델 적재는 첫 실행에 수 분 (HF 16GB 다운로드)
#
# 앱은 Tailscale 주소의 8100 을 자동으로 잡는다.
services:
  backend:
    build: .
    image: beautytalk-backend:router
    container_name: beautytalk-backend
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      # 모델 캐시. 이게 없으면 컨테이너를 다시 만들 때마다 16GB 를 다시 받는다.
      - hf-cache:/cache/hf
      # 프롬프트만 고치고 재시작하고 싶을 때 — 이미지 재빌드 없이 반영된다.
      - ./beautytalk/assets:/app/beautytalk/assets:ro
    environment:
      - BT_PORT=8100
      - BT_LOG_LEVEL=INFO
      # 전면 카메라 미러링 되돌리기 — 아래 README "미러링" 절을 읽고 정할 것
      - BT_MIRRORED_DEFAULT=false
      # 모델을 바꾸려면 여기만
      # - BT_BASE_MODEL=unsloth/qwen3-vl-8b-instruct-unsloth-bnb-4bit
      # - BT_MAKEUP_ADAPTER=iouty/qwen3vl-makeup-qwen3vl_augmented
      # 비공개 저장소를 쓰면 토큰 필요
      # - HF_TOKEN=${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 4bit 8B + few-shot 4장이면 공유메모리가 기본 64MB 로는 모자란다
    shm_size: "2gb"

volumes:
  hf-cache:
